<section class="dr-container" aria-label="Daily Routine">
  <!-- Header matching mockup style -->
  <div class="dr-header">
    <div class="dr-header-left">
      <div class="dr-icon-bg" aria-hidden="true">
        <span class="material-symbols-outlined">schedule</span>
      </div>
      <div class="dr-header-titles">
        <h2 class="dr-section-title">Daily Routine</h2>
      </div>
    </div>
  </div>

  <div class="dr-list">
    @for (item of items(); track item.id; let last = $last) {
      <article class="dr-list-card" [class.is-done]="item.done" [attr.data-tone]="item.tone">
        <!-- Left Icon -->
        <div class="dr-icon-col">
          <app-icon-tile [icon]="item.icon" [tone]="item.tone" size="md" />
        </div>

        <!-- Middle Content -->
        <div class="dr-content-col">
          <h3 class="dr-title">{{ item.title }}</h3>
          <span class="dr-detail-text">
            {{ item.duration || 'Flexible' }}
            @if (item.note) {
              • {{ item.note }}
            }
          </span>
        </div>

        <!-- Right Content: Time and Toggle -->
        <div class="dr-meta-col">
          <div class="dr-meta-time">
            <span class="dr-time-val">{{ formatTime(item.time).time }}</span>
            <span class="dr-time-period">{{ formatTime(item.time).period }}</span>
          </div>
          
          <button
            type="button"
            class="dr-toggle"
            [class.is-done]="item.done"
            [attr.data-tone]="item.tone"
            (click)="toggleDone(item.id)"
            [attr.aria-label]="(item.done ? 'Mark incomplete: ' : 'Mark complete: ') + item.title"
          >
            @if (item.done) {
              <span class="material-symbols-outlined dr-check-icon">check_circle</span>
            } @else {
              <span class="material-symbols-outlined dr-uncheck-icon">radio_button_unchecked</span>
            }
          </button>
        </div>
      </article>
    }
  </div>
</section>
