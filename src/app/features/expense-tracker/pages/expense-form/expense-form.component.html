<div class="app-shell fade-in-bottom">
  <!-- ── Page Header ── -->
  <header class="dashboard-header">
    <button (click)="goBack()" class="hh-back-btn" aria-label="Go Back">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>

    <div class="hh-title-wrap">
      <h1 class="hh-title">{{ pageTitle() }}</h1>
      <p class="hh-subtitle">{{ pageSubtitle() }}</p>
    </div>

    @if (mode() === 'edit') {
      <div class="hh-actions">
        <button
          type="button"
          (click)="showDeleteConfirm.set(!showDeleteConfirm())"
          class="hh-btn hh-btn--delete"
          title="Delete Transaction"
        >
          <span class="material-symbols-outlined">delete</span>
        </button>
      </div>
    }
  </header>

  <!-- ── Main Form Section ── -->
  <main class="form-container">
    @if (isLoadingData()) {
      <div class="pop-empty">
        <span class="material-symbols-outlined spin" style="font-size: 32px; color: var(--lm-color-primary);">sync</span>
        <p class="pop-empty-title">Loading details...</p>
      </div>
    } @else {
      <!-- Delete confirmation prompt in Edit Mode -->
      @if (showDeleteConfirm()) {
        <div class="delete-banner fade-in-bottom">
          <div class="delete-banner-text">
            <span class="material-symbols-outlined icon-warn">warning</span>
            <span>Are you sure you want to delete this transaction permanently?</span>
          </div>
          <div class="delete-banner-actions">
            <button class="btn-cancel" (click)="showDeleteConfirm.set(false)">Cancel</button>
            <button class="btn-confirm-delete" (click)="deleteCurrentExpense()" [disabled]="isDeleting()">
              {{ isDeleting() ? 'Deleting...' : 'Delete' }}
            </button>
          </div>
        </div>
      }

      <form [formGroup]="expenseForm" (ngSubmit)="submitForm()" class="expense-full-form">
        <!-- ── 1. Amount Card ── -->
        <div class="form-card amount-card">
          <label class="form-label-top">AMOUNT</label>
          <div class="amount-input-wrap">
            <span class="currency-symbol">₹</span>
            <input
              type="number"
              formControlName="amount"
              class="amount-input"
              placeholder="0"
              autofocus
            />
          </div>
        </div>

        <!-- ── 2. Primary Details ── -->
        <div class="form-card">
          <div class="field-group">
            <label class="field-label">Title / Subject</label>
            <div class="field-input-wrap">
              <span class="material-symbols-outlined field-icon">title</span>
              <input
                type="text"
                formControlName="title"
                class="field-input"
                placeholder="e.g. Dinner with Friends, House Rent"
              />
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">Merchant / Recipient</label>
            <div class="field-input-wrap">
              <span class="material-symbols-outlined field-icon">storefront</span>
              <input
                type="text"
                formControlName="merchant"
                class="field-input"
                placeholder="e.g. Swiggy, Amazon, Vikas"
              />
            </div>
          </div>
        </div>

        <!-- ── 3. Category & Method ── -->
        <div class="form-card">
          <div class="form-grid-2">
            <div class="field-group">
              <div class="label-with-link">
                <label class="field-label">Category</label>
                <a routerLink="/expenses/categories" class="field-hint-link">Manage</a>
              </div>
              <div class="field-input-wrap">
                <span class="material-symbols-outlined field-icon">category</span>
                <select formControlName="category" class="field-input select-caret">
                  @for (cat of categories(); track cat.name) {
                    <option [value]="cat.name">{{ cat.name }}</option>
                  }
                </select>
              </div>
            </div>

            <div class="field-group">
              <label class="field-label">Payment Method</label>
              <div class="field-input-wrap">
                <span class="material-symbols-outlined field-icon">payments</span>
                <select formControlName="paymentMethod" class="field-input select-caret">
                  <option value="UPI">UPI</option>
                  <option value="Credit Card">Credit Card</option>
                  <option value="Debit Card">Debit Card</option>
                  <option value="Net Banking">Net Banking</option>
                  <option value="Cash">Cash</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">Date & Time</label>
            <div class="field-input-wrap">
              <span class="material-symbols-outlined field-icon">event</span>
              <input type="datetime-local" formControlName="date" class="field-input" />
            </div>
          </div>
        </div>

        <!-- ── 4. Optional Metadata ── -->
        <div class="form-card">
          <div class="field-group">
            <label class="field-label">Tags (Optional)</label>
            <div class="field-input-wrap">
              <span class="material-symbols-outlined field-icon">sell</span>
              <input
                type="text"
                formControlName="tags"
                class="field-input"
                placeholder="e.g. Weekend, Travel, Shared (comma separated)"
              />
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">Notes (Optional)</label>
            <div class="field-input-wrap">
              <span class="material-symbols-outlined field-icon textarea-icon">description</span>
              <textarea
                formControlName="notes"
                class="field-input field-textarea"
                placeholder="Add any extra notes or memo..."
                rows="3"
              ></textarea>
            </div>
          </div>
        </div>

        <!-- ── Bottom Action Button ── -->
        <div class="form-submit-row">
          <button
            type="submit"
            class="submit-main-btn"
            [class.submit-main-btn--approve]="mode() === 'review'"
            [disabled]="expenseForm.invalid || isSubmitting()"
          >
            @if (isSubmitting()) {
              <span class="material-symbols-outlined spin">sync</span>
              <span>Saving...</span>
            } @else {
              <span class="material-symbols-outlined">
                {{ mode() === 'review' ? 'task_alt' : mode() === 'edit' ? 'check_circle' : 'add_circle' }}
              </span>
              <span>{{ submitButtonText() }}</span>
            }
          </button>
        </div>
      </form>
    }
  </main>

  <app-bottom-nav></app-bottom-nav>
</div>
